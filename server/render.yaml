services:
  - type: web
    name: herokeys-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd src && PYTHONPATH=. uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: PYTHONPATH
        value: ./src
      - key: TF_NUM_INTEROP_THREADS
        value: "1"
      - key: TF_NUM_INTRAOP_THREADS
        value: "1"
      - key: TF_FORCE_GPU_ALLOW_GROWTH
        value: "true"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
    disk:
      name: herokeys-disk
      mountPath: /opt/render/project/src/temp
      sizeGB: 1
